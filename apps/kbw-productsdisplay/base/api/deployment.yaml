---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kbw-productsdisplay-api
  labels:
    app: kbw-productsdisplay-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kbw-productsdisplay-api
  template:
    metadata:
      labels:
        app: kbw-productsdisplay-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: playwright
          image: mcr.microsoft.com/playwright:v1.56.0-jammy
          restartPolicy: Always
          command:
            - /bin/sh
            - -lc
          args:
            - >
              exec /ms-playwright/chromium-*/chrome-linux/chrome
              --headless=new
              --no-sandbox
              --disable-gpu
              --disable-dev-shm-usage
              --remote-debugging-address=0.0.0.0
              --remote-debugging-port=9222
              --remote-allow-origins=*
              --user-data-dir=/tmp/chrome
              about:blank
          ports:
            - containerPort: 9222
              name: cdp
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null
            periodSeconds: 1
            failureThreshold: 30
          env:
            - name: HOME
              value: /home/pwuser
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: ghcr.io/1spyral/productsdisplay-api
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: kbw-productsdisplay-api-config
            - secretRef:
                name: kbw-productsdisplay-api-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
