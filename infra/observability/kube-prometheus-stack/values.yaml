fullnameOverride: kube-prometheus-stack

grafana:
  enabled: true

  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      jsonData:
        maxLines: 1000
        timeout: 60

  persistence:
    enabled: true
    type: pvc
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    finalizers:
      - kubernetes.io/pvc-protection

  serviceMonitor:
    enabled: true
    path: "/metrics"

prometheus:
  enabled: true
  prometheusSpec:
    retentionSize: 30GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
