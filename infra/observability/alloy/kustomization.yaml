---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrelease.yaml

configMapGenerator:
  - name: alloy-values
    files:
      - values.yaml
    namespace: flux-system
  - name: alloy-config
    files:
      - config.alloy
    namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
